name: Playwright deployment smoke

on:
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  read-only:
    if: ${{ github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run read-only smoke for deployed URL
        if: ${{ github.event_name == 'deployment_status' }}
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run e2e:smoke
      - name: Run read-only smoke for configured URL
        if: ${{ github.event_name != 'deployment_status' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: npm run e2e:smoke
      - name: Upload smoke report after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            playwright-report/lab12/*/smoke/
            test-results/lab12/*/smoke/
          retention-days: 7
          if-no-files-found: ignore
